<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest_sender.json">
    <title>KLAP-transmitter_ver3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        textarea {
            resize: none;
            transition: all 0.3s ease;
        }
        .status-message {
            padding: 10px;
            margin-top: 15px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
            word-break: break-word; 
        }
        .success {
            background-color: #d1fae5;
            color: #065f46;
        }
        .error {
            background-color: #fee2e2;
            color: #991b1b;
        }
        .info {
            background-color: #dbeafe;
            color: #1e40af;
        }

        /* 点滅アニメーションの定義 (ステータス表示用) */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .blinking {
            animation: blink 1s step-start 0s infinite;
        }

        /* プリセットボタンのスタイル */
        .preset-btn {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        @media all and (display-mode: standalone) {
            body {
                padding-top: max(1rem, env(safe-area-inset-top));
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="text-3xl font-extrabold mb-4 text-gray-800 text-center">ESP-NOW メッセージ送信機</h1>
    <p class="text-sm text-gray-500 mb-6 text-center">ノードB（サインボード）へメッセージを送信します。</p>
    
    <div id="preset-buttons" class="flex flex-wrap gap-3 mb-6">
        <button type="button" data-message="PIT IN" class="preset-btn flex-1 py-2 px-4 rounded-lg shadow-md text-base font-bold text-white bg-green-600 hover:bg-green-700 transition duration-150 ease-in-out">
            🚨 PIT IN
        </button>
        <button type="button" data-message="PIT IN & GAS" class="preset-btn flex-1 py-2 px-4 rounded-lg shadow-md text-base font-bold text-white bg-blue-600 hover:bg-blue-700 transition duration-150 ease-in-out">
            ⛽ PIT IN & GAS
        </button>
    </div>
    
    <div id="status-display" class="status-message info">接続情報: ロード中...</div>

    <form id="send-form" class="space-y-4">
        <div>
            <label for="message-input" class="block text-sm font-medium text-gray-700 mb-1">送信メッセージ (最大 249文字)</label>
            <textarea id="message-input" rows="5" maxlength="249"
                      class="mt-1 block w-full border border-gray-300 rounded-lg shadow-sm p-3 focus:ring-indigo-500 focus:border-indigo-500 text-lg">PIT IN</textarea>
            <div class="text-right text-sm text-gray-500 mt-1">
                <span id="char-count">0</span> / 249
            </div>
        </div>
        
        <div id="button-container">
            <button type="submit" id="send-button" 
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-md text-base font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                送信
            </button>
        </div>
    </form>
    
    <p class="text-xs text-gray-400 mt-6 text-center">ノードAのWeb API IP: <span id="ip-address" class="font-mono text-indigo-500">192.168.4.1</span></p>

</div>

<script>
    const NODE_A_IP = "192.168.4.1"; 
    const API_URL = `http://${NODE_A_IP}/send`; 
    const MAX_RETRY_TIME_MS = 30000; // 30秒
    const RETRY_INTERVAL_MS = 500; // 0.5秒間隔

    const form = document.getElementById('send-form');
    const input = document.getElementById('message-input');
    const statusDisplay = document.getElementById('status-display');
    const charCount = document.getElementById('char-count');
    const ipDisplay = document.getElementById('ip-address');
    const presetButtonsContainer = document.getElementById('preset-buttons');

    let isSending = false;
    let stopSending = false;
    let retryTimer = null;

    ipDisplay.textContent = NODE_A_IP;

    // UIの点滅処理を制御 (ステータス表示のみ点滅させる)
    function startBlinking() {
        statusDisplay.classList.add('blinking');
    }

    function stopBlinking() {
        statusDisplay.classList.remove('blinking');
    }

    // ⭐ 修正: ボタンの状態を「キャンセル」に切り替える
    function updateButtonToCancel() {
        const button = document.getElementById('send-button');
        if (button) {
            button.id = 'cancel-button';
            button.type = 'button'; 
            button.classList.remove('bg-indigo-600', 'hover:bg-indigo-700', 'focus:ring-indigo-500');
            button.classList.add('bg-red-600', 'hover:bg-red-700', 'focus:ring-red-500');
            button.innerHTML = '<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>送信キャンセル';
            
            // ⭐ 確実にクリックイベントを設定し直す ⭐
            button.onclick = handleCancel; 
        }
    }

    // ⭐ 修正: ボタンの状態を「送信」に切り替える
    function updateButtonToSend() {
        const button = document.getElementById('cancel-button');
        if (button) {
            button.id = 'send-button';
            button.type = 'submit'; 
            button.classList.remove('bg-red-600', 'hover:bg-red-700', 'focus:ring-red-500');
            button.classList.add('bg-indigo-600', 'hover:bg-indigo-700', 'focus:ring-indigo-500');
            button.innerHTML = '<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>送信';
            button.onclick = null; // フォームのsubmitイベントが処理するように戻す
        }
    }

    function displayStatus(message, type) {
        statusDisplay.textContent = message;
        statusDisplay.className = `status-message ${type}`;
        statusDisplay.style.display = 'block';
    }

    // ⭐ 修正: キャンセルボタンが押された時の処理 (ログを追加) ⭐
    function handleCancel() {
        console.log("CANCEL button clicked. Attempting to stop sending.");
        
        if (isSending) { 
            if (retryTimer) {
                clearTimeout(retryTimer);
            }
            stopSending = true; 
            
            // finalizeSendingを呼び出してUIをリセット
            finalizeSending('❌ 送信をキャンセルしました。', 'error', false);
        }
    }

    // 送信処理の終了（成功、失敗、キャンセル時）
    function finalizeSending(message, type, resetInput = true) {
        stopBlinking();
        updateButtonToSend(); // (1) ボタンを「送信」に戻す
        isSending = false;    // (2) 送信状態を解除
        stopSending = false;
        if (retryTimer) clearTimeout(retryTimer);
        
        displayStatus(message, type);
        input.disabled = false; // (3) テキスト入力を有効化

        // 8秒後にメッセージを非表示にする
        setTimeout(() => {
            statusDisplay.style.display = 'none';
        }, 8000);
    }
    
    // メインの送信リトライロジック
    async function attemptSend(message, startTime) {
        if (stopSending) return; // キャンセルされたら即停止

        const elapsedTime = millis() - startTime;
        if (elapsedTime >= MAX_RETRY_TIME_MS) {
            finalizeSending(`❌ 配信失敗: 30秒以内にノードBから応答がありませんでした。`, 'error', false);
            return;
        }

        // UIを更新
        const timeRemaining = Math.ceil((MAX_RETRY_TIME_MS - elapsedTime) / 1000);
        displayStatus(`📡 送信中... (残り ${timeRemaining}秒, リトライ中)`, 'info');
        
        let success = false;
        let errorMessage = '不明なエラー';

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' }, 
                body: message
            });

            if (response.status === 200) {
                success = true;
            } else if (response.status === 503) {
                const errorData = await response.json().catch(() => ({ message: 'ノードBがオフラインです。' }));
                errorMessage = errorData.message || '受信機から応答がありません。';
            } else {
                errorMessage = `HTTPエラー ${response.status}が発生しました。`;
            }

        } catch (error) {
            console.error('ネットワーク接続エラー:', error);
            errorMessage = `ノードAへの接続エラー。Wi-Fi接続を確認してください。`;
        }

        if (success) {
            finalizeSending('✅ 送信成功！メッセージはノードBに配信されました。', 'success');
        } else {
            if (!stopSending) {
                statusDisplay.textContent = `📡 送信中... (残り ${timeRemaining}秒, リトライ: ${errorMessage})`;
                retryTimer = setTimeout(() => attemptSend(message, startTime), RETRY_INTERVAL_MS);
            }
        }
    }

    // プリセットボタンの送信ハンドラ
    function handlePresetSend(message) {
        if (isSending) return;

        input.value = message; 
        charCount.textContent = message.length;
        
        isSending = true;
        stopSending = false;

        input.disabled = true; 
        updateButtonToCancel();
        startBlinking();

        const startTime = millis();
        attemptSend(message, startTime);
    }


    // フォーム送信時の初期処理 (手動入力時の送信)
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const message = input.value;
        
        if (!message.trim()) {
            displayStatus('メッセージを入力してください。', 'error');
            return;
        }

        if (isSending) return;
        isSending = true;
        stopSending = false;

        input.disabled = true; 
        updateButtonToCancel();
        startBlinking();

        const startTime = millis();
        attemptSend(message, startTime);
    });

    input.addEventListener('input', () => {
        charCount.textContent = input.value.length;
    });

    // ユーティリティ関数
    function millis() {
        return new Date().getTime();
    }

    // PWA: サービスワーカーの登録 (変更なし)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker-sender.js') 
          .then(registration => {
            console.log('Service Worker registered with scope:', registration.scope);
          })
          .catch(error => {
            console.error('Service Worker registration failed:', error);
          });
      });
    }


    document.addEventListener('DOMContentLoaded', () => {
        charCount.textContent = input.value.length; 
        
        displayStatus(`デバイスをノードAのSoftAPに接続し、このPWAを起動してください。`, 'info');
        
        presetButtonsContainer.querySelectorAll('.preset-btn').forEach(button => {
            button.addEventListener('click', (e) => {
                const message = e.currentTarget.getAttribute('data-message');
                handlePresetSend(message);
            });
        });
    });
</script>

</body>
</html>
