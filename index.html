<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PWA化は推奨しないため、manifestのリンクはコメントアウトします -->
    <link rel="manifest" href="manifest.json">
    <title>KLAP-transmitter-ver5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        textarea {
            resize: none;
            transition: all 0.3s ease;
        }
        .status-message {
            padding: 15px;
            margin-top: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-weight: bold;
            word-break: break-word; 
            text-align: center; 

            /* opacityとvisibilityの変更にトランジションを設定 */
            transition: opacity 0.3s ease, box-shadow 0.3s ease, background-color 0.3s;
            
            /* レイアウトシフト防止の修正: 高さを固定し、Flexboxでメッセージを中央に配置 */
            height: 100px; /* 高さを固定 */
            display: flex;
            align-items: center; /* 垂直方向の中央揃え */
            justify-content: center; /* 水平方向の中央揃え */
            
            opacity: 0; /* 初期状態で透明 */
            visibility: hidden; /* 初期状態で非表示だがスペースは確保 */
        }
        .success {
            background-color: #d1fae5;
            color: #065f46;
            box-shadow: 0 0 15px rgba(6, 95, 70, 0.3);
        }
        .error {
            /* リトライ中のエラーも目立つように赤系を使用 */
            background-color: #fee2e2; 
            color: #991b1b;
        }
        .info {
            background-color: #dbeafe;
            color: #1e40af;
        }

        /* 送信中の点滅アニメーション */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .blinking {
            /* opacityはアニメーションで制御 */
            animation: blink 1s step-start 0s infinite;
        }
        
        /* 成功時の縦揺れアニメーション */
        @keyframes shake-vertical {
            0%, 100% { transform: translateY(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateY(-3px); }
            20%, 40%, 60%, 80% { transform: translateY(3px); }
        }
        .shake-on-success {
            animation: shake-vertical 1s ease-in-out infinite;
        }

        /* プリセットボタンのスタイル */
        .preset-btn {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        @media all and (display-mode: standalone) {
            body {
                padding-top: max(1rem, env(safe-area-inset-top));
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="text-3xl font-extrabold mb-4 text-gray-800 text-center">KLAP-transmitter</h1>
    <p class="text-sm text-gray-500 mb-6 text-center">ノードB（サインボード）へメッセージを送信します。</p>
    
    <!-- プリセットボタンエリア -->
    <div id="preset-buttons" class="flex flex-wrap gap-3 mb-6">
        <button type="button" data-message="PIT IN" class="preset-btn flex-1 py-2 px-4 rounded-lg shadow-md text-base font-bold text-white bg-green-600 hover:bg-green-700 transition duration-150 ease-in-out">
            🚨 PIT IN
        </button>
        <button type="button" data-message="PIT IN & GAS" class="preset-btn flex-1 py-2 px-4 rounded-lg shadow-md text-base font-bold text-white bg-blue-600 hover:bg-blue-700 transition duration-150 ease-in-out">
            ⛽ PIT IN & GAS
        </button>
    </div>
    
    <!-- ステータス表示エリア: heightで高さ固定 -->
    <div id="status-display" class="status-message info">接続情報: ロード中...</div>

    <form id="send-form" class="space-y-4">
        <div>
            <label for="message-input" class="block text-sm font-medium text-gray-700 mb-1">送信メッセージ (最大 249文字)</label>
            <textarea id="message-input" rows="5" maxlength="249"
                      class="mt-1 block w-full border border-gray-300 rounded-lg shadow-sm p-3 focus:ring-indigo-500 focus:border-indigo-500 text-lg">PIT IN</textarea>
            <div class="text-right text-sm text-gray-500 mt-1">
                <span id="char-count">0</span> / 249
            </div>
        </div>
        
        <!-- 送信/キャンセルボタンのコンテナ -->
        <div id="button-container">
            <button type="button" id="send-button" 
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-md text-base font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                送信
            </button>
        </div>
    </form>
    
    <p class="text-xs text-gray-400 mt-6 text-center">ノードAのWeb API IP: <span id="ip-address" class="font-mono text-indigo-500">192.168.4.1</span></p>

</div>

<script>
    const NODE_A_IP = "192.168.4.1"; 
    const API_URL = `http://${NODE_A_IP}/send`; 
    const MAX_RETRY_TIME_MS = 30000; // 30秒 (全体リトライ時間制限)
    const RETRY_INTERVAL_MS = 500; // 0.5秒間隔 (次のリトライまでの待機時間)
    const FETCH_TIMEOUT_MS = 5000; // 5秒 (個々のfetchリクエストの強制タイムアウト)

    const input = document.getElementById('message-input');
    const statusDisplay = document.getElementById('status-display');
    const charCount = document.getElementById('char-count');
    const ipDisplay = document.getElementById('ip-address');
    const presetButtonsContainer = document.getElementById('preset-buttons');
    const sendButton = document.getElementById('send-button');

    let isSending = false;
    let stopSending = false;
    let retryTimer = null;

    ipDisplay.textContent = NODE_A_IP;

    // ユーティリティ関数
    function millis() {
        return new Date().getTime();
    }
    
    // === 修正点: fetchリクエストに強制タイムアウトを設定する関数 ===
    async function fetchWithTimeout(resource, options = {}) {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);

        try {
            const response = await fetch(resource, {
                ...options,
                signal: controller.signal
            });
            clearTimeout(id);
            return response;
        } catch (error) {
            clearTimeout(id);
            if (error.name === 'AbortError') {
                throw new Error('Timeout: fetchリクエストが5秒を超過しました。');
            }
            throw error;
        }
    }
    // ==========================================================

    // UIの点滅処理を制御
    function startBlinking() {
        if (!statusDisplay.classList.contains('blinking')) {
            statusDisplay.classList.add('blinking');
        }
    }

    function stopBlinking() {
        statusDisplay.classList.remove('blinking');
    }

    // displayStatus関数
    function displayStatus(message, type) {
        statusDisplay.textContent = message;
        statusDisplay.classList.remove('success', 'error', 'info', 'shake-on-success');
        statusDisplay.classList.add(type);
        statusDisplay.style.visibility = 'visible';
        statusDisplay.style.opacity = '1';
    }


    // ボタンの見た目を「送信」または「キャンセル」に切り替える
    function updateButtonState(state) {
        if (state === 'cancel') {
            sendButton.classList.remove('bg-indigo-600', 'hover:bg-indigo-700', 'focus:ring-indigo-500');
            sendButton.classList.add('bg-red-600', 'hover:bg-red-700', 'focus:ring-red-500');
            sendButton.innerHTML = '<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>送信キャンセル';
        } else { // 'send'
            sendButton.classList.remove('bg-red-600', 'hover:bg-red-700', 'focus:ring-red-500');
            sendButton.classList.add('bg-indigo-600', 'hover:bg-indigo-700', 'focus:ring-indigo-500');
            sendButton.innerHTML = '<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>送信';
        }
    }

    // キャンセルボタンが押された時の処理
    function handleCancel() {
        if (isSending) { 
            if (retryTimer) {
                clearTimeout(retryTimer);
            }
            stopSending = true; 
            finalizeSending('❌ 送信をキャンセルしました。', 'error', false);
        }
    }

    // 送信処理の終了（成功、失敗、キャンセル時）
    function finalizeSending(message, type, resetInput = true) {
        stopBlinking(); 
        updateButtonState('send'); 
        isSending = false;   
        stopSending = false;
        if (retryTimer) clearTimeout(retryTimer);
        
        displayStatus(message, type);
        
        if (type === 'success') {
            statusDisplay.classList.add('shake-on-success');
        } 

        input.disabled = false; 

        // 8秒後にメッセージを非表示にする
        setTimeout(() => {
            statusDisplay.style.opacity = '0';
            statusDisplay.style.visibility = 'hidden';
            statusDisplay.classList.remove('shake-on-success'); 
        }, 8000);
    }
    
    // メインの送信リトライロジック
    async function attemptSend(message, startTime) {
        if (stopSending) {
            return; 
        }

        const elapsedTime = millis() - startTime;
        if (elapsedTime >= MAX_RETRY_TIME_MS) {
            // 30秒超過による停止処理
            finalizeSending(`❌ 配信失敗: ${MAX_RETRY_TIME_MS / 1000}秒以内にノードBから応答がありませんでした。`, 'error', false);
            return; 
        }

        // UIを更新
        const timeRemaining = Math.ceil((MAX_RETRY_TIME_MS - elapsedTime) / 1000);
        
        startBlinking(); 
        displayStatus(`📡 送信中... (残り ${timeRemaining}秒, リトライ中)`, 'info');
        
        let success = false;
        let errorMessage = '不明なエラー';

        try {
            // === 修正点: fetchWithTimeoutを使用し、5秒で必ずタイムアウトさせる ===
            const response = await fetchWithTimeout(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text-plain' }, 
                body: message
            });

            if (response.status === 200) {
                success = true;
            } else if (response.status === 503) {
                const errorData = await response.json().catch(() => ({ message: 'ノードBがオフラインです。' }));
                errorMessage = errorData.message || '受信機から応答がありません。';
            } else {
                errorMessage = `HTTPエラー ${response.status}が発生しました。`;
            }

        } catch (error) {
            if (error.message.includes('Timeout')) {
                errorMessage = 'ノードAへの接続が5秒でタイムアウトしました。Wi-Fi接続を確認してください。';
            } else {
                errorMessage = `ノードAへの接続エラー。Wi-Fi接続を確認してください。`;
            }
            success = false;
        }

        if (success) {
            finalizeSending('✅ 送信成功！メッセージはノードBに配信されました。', 'success');
        } else {
            if (!stopSending) {
                // エラー発生時は「error」スタイルでリトライメッセージを表示
                displayStatus(`🚨 エラー発生: ${errorMessage} (残り ${timeRemaining}秒, リトライ中)`, 'error');
                startBlinking(); 
                
                // 次のリトライをスケジュール
                retryTimer = setTimeout(() => attemptSend(message, startTime), RETRY_INTERVAL_MS);
            }
        }
    }

    // プリセットボタンの送信ハンドラ
    function handlePresetSend(message) {
        if (isSending) return;

        input.value = message; 
        charCount.textContent = message.length;
        
        isSending = true;
        stopSending = false;

        input.disabled = true; 
        updateButtonState('cancel');
        startBlinking();

        const startTime = millis();
        attemptSend(message, startTime);
    }


    // 送信ボタンのクリックリスナー (SEND/CANCEL両方を処理)
    sendButton.addEventListener('click', async (e) => {
        e.preventDefault(); 

        if (isSending) {
            // 送信中の場合: CANCELとして動作
            handleCancel();
            return;
        }
        
        // 未送信の場合: SENDとして動作
        const message = input.value;
        
        if (!message.trim()) {
            displayStatus('メッセージを入力してください。', 'error');
            return;
        }

        isSending = true;
        stopSending = false;

        input.disabled = true; 
        updateButtonState('cancel'); // ボタンをキャンセル表示に切り替え
        startBlinking();

        const startTime = millis();
        attemptSend(message, startTime);
    });

    input.addEventListener('input', () => {
        charCount.textContent = input.value.length;
    });


    document.addEventListener('DOMContentLoaded', () => {
        charCount.textContent = input.value.length; 
        
        // 初回表示メッセージの表示をopacity: 1にして可視化
        statusDisplay.style.opacity = '1';
        statusDisplay.style.visibility = 'visible';
        displayStatus(`デバイスをノードAのSoftAPに接続し、このページを開いてください。`, 'info');
        
        presetButtonsContainer.querySelectorAll('.preset-btn').forEach(button => {
            button.addEventListener('click', (e) => {
                const message = e.currentTarget.getAttribute('data-message');
                handlePresetSend(message);
            });
        });
    });
</script>

</body>
</html>
