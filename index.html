<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json"> <!-- 送信機専用のマニフェストを参照 -->
    <title>klap-transmitter-ver3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* (CSS is not changed) */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        textarea {
            resize: none;
            transition: all 0.3s ease;
        }
        .status-message {
            padding: 10px;
            margin-top: 15px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
            word-break: break-word; 
        }
        .success {
            background-color: #d1fae5;
            color: #065f46;
        }
        .error {
            background-color: #fee2e2;
            color: #991b1b;
        }
        .info {
            background-color: #dbeafe;
            color: #1e40af;
        }
        @media all and (display-mode: standalone) {
            body {
                padding-top: max(1rem, env(safe-area-inset-top));
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="text-3xl font-extrabold mb-4 text-gray-800 text-center">ESP-NOW メッセージ送信機</h1>
    <p class="text-sm text-gray-500 mb-6 text-center">ノードB（サインボード）へメッセージを送信します。</p>
    
    <div id="status-display" class="status-message info">接続情報: ロード中...</div>

    <form id="send-form" class="space-y-4">
        <div>
            <label for="message-input" class="block text-sm font-medium text-gray-700 mb-1">送信メッセージ (最大 249文字)</label>
            <textarea id="message-input" rows="5" maxlength="249"
                      class="mt-1 block w-full border border-gray-300 rounded-lg shadow-sm p-3 focus:ring-indigo-500 focus:border-indigo-500 text-lg"></textarea>
            <div class="text-right text-sm text-gray-500 mt-1">
                <span id="char-count">0</span> / 249
            </div>
        </div>
        
        <button type="submit" id="send-button" 
                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-md text-base font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            送信
        </button>
    </form>
    
    <p class="text-xs text-gray-400 mt-6 text-center">ノードAのWeb API IP: <span id="ip-address" class="font-mono text-indigo-500">192.168.4.1</span></p>

</div>

<script>
    // ノードAのSoftAP IPアドレス
    const NODE_A_IP = "192.168.4.1"; 
    const API_URL = `http://${NODE_A_IP}/send`; 

    const form = document.getElementById('send-form');
    const input = document.getElementById('message-input');
    const button = document.getElementById('send-button');
    const statusDisplay = document.getElementById('status-display');
    const charCount = document.getElementById('char-count');
    const ipDisplay = document.getElementById('ip-address');

    ipDisplay.textContent = NODE_A_IP;

    function displayStatus(message, type) {
        statusDisplay.textContent = message;
        statusDisplay.className = `status-message ${type}`;
        statusDisplay.style.display = 'block';
        
        // 8 seconds to hide the message
        setTimeout(() => {
            statusDisplay.style.display = 'none';
        }, 8000);
    }

    input.addEventListener('input', () => {
        charCount.textContent = input.value.length;
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const message = input.value;
        
        if (!message.trim()) {
            displayStatus('メッセージを入力してください。', 'error');
            return;
        }

        button.disabled = true;
        button.innerHTML = '<svg class="w-5 h-5 mr-2 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.057 4m2.583 0H4v5m14.59 2a8.001 8.001 0 01-13.391 6.36M18.582 6l-3.5 3.5"></path></svg>配信結果待機中...';
        displayStatus('メッセージの配信結果を待機しています...', 'info');

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' }, 
                body: message
            });

            // IMPORTANT: Check HTTP status code, especially 503 (Service Unavailable)
            if (!response.ok || response.status === 503) {
                const errorData = await response.json().catch(() => ({ message: 'サーバー応答が不正です。' }));
                
                // If 503 error, the message failed to deliver via ESP-NOW
                if (response.status === 503) {
                     displayStatus(`❌ 配信失敗: ${errorData.message}`, 'error');
                     return; 
                }
                
                // Other HTTP errors
                throw new Error(`HTTPエラー ${response.status}: ${errorData.message || 'サーバー応答が不正です。'}`);
            }

            // 200 OK (Delivery success)
            const result = await response.json();
            
            if (result.status === 'ok') {
                displayStatus('送信成功！メッセージはノードBに配信されました。', 'success');
            } else {
                // In case of 200 OK but status is not 'ok' (unexpected)
                displayStatus(`配信失敗: ${result.message}`, 'error');
            }

        } catch (error) {
            console.error('送信エラー:', error);
            let userMessage = error.message;

            if (error instanceof TypeError) {
                 userMessage = `ネットワークエラーです。ノードAのSoftAP (${ipDisplay.textContent}) に接続しているか確認してください。`;
            } else if (error.message.includes('HTTPエラー')) {
                userMessage = error.message;
            }
            
            displayStatus(userMessage, 'error');
        } finally {
            button.disabled = false;
            button.innerHTML = '<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>送信';
        }
    });

    // PWA: Service Worker Registration (unchanged)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker-sender.js') 
          .then(registration => {
            console.log('Service Worker registered with scope:', registration.scope);
          })
          .catch(error => {
            console.error('Service Worker registration failed:', error);
          });
      });
    }


    document.addEventListener('DOMContentLoaded', () => {
        displayStatus(`デバイスをノードAのSoftAPに接続し、このPWAを起動してください。`, 'info');
    });
</script>

</body>
</html>
